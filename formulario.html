<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novo ponto</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar" id="navbar"></header>
  <main class="container">
    <section>
      <h1 id="titulo">Novo ponto</h1>
      <p class="info escondido" id="carregando">Carregando...</p>
      <p class="erro escondido" id="erro"></p>
      <div class="escondido" id="secao-form">
        <form class="formulario" id="form-ponto">
          <label for="name">Nome *</label>
          <input id="name" name="name" required maxlength="100" />
          <label for="description">Descrição</label>
          <textarea id="description" name="description" maxlength="255" rows="3"></textarea>
          <div class="linha">
            <div>
              <label for="latitude">Latitude *</label>
              <input id="latitude" name="latitude" type="number" step="any" min="-90" max="90" required />
            </div>
            <div>
              <label for="longitude">Longitude *</label>
              <input id="longitude" name="longitude" type="number" step="any" min="-180" max="180" required />
            </div>
          </div>
          <div class="acoes">
            <button type="submit" id="btn-salvar">Cadastrar</button>
            <a href="index.html" class="botao secundario">Cancelar</a>
          </div>
        </form>
      </div>
      <a href="index.html" class="escondido" id="voltar">Voltar para a lista</a>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script src="js/componentes.js"></script>
  <script src="js/formulario.js"></script>
</body>
</html>
